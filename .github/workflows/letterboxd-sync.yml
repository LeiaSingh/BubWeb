name: Letterboxd sync

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:          # "Run workflow" button for an instant sync

permissions:
  contents: write

concurrency:
  group: letterboxd-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/letterboxd-sync.mjs
      - name: Commit new diary entries
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "bubweb-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/letterboxd.json
            git commit -m "Letterboxd sync"
            git push
          fi
